name: Publish to npm

on:
  push:
    tags:
      - '*/v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    container: node:26.3.0
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Detect package from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          PACKAGE="${TAG%/v*}"
          echo "package=$PACKAGE" >> $GITHUB_OUTPUT
          echo "dir=packages/$PACKAGE" >> $GITHUB_OUTPUT

      - name: Build
        run: npm run build -w packages/${{ steps.pkg.outputs.package }}

      - name: Publish
        run: npm publish --access public --provenance
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
