name: Publish to npm

on:
  push:
    tags:
      - '*/v*'
  workflow_dispatch:
    inputs:
      package:
        description: Package to build and pack
        required: true
        type: choice
        options:
          - s3-upload-proxy
          - decap-cms-media-library-s3

jobs:
  publish:
    runs-on: ubuntu-26.04
    container: node:26.3.0
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Select package
        id: pkg
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            PACKAGE="${{ inputs.package }}"
          else
            TAG="${GITHUB_REF_NAME}"
            PACKAGE="${TAG%/v*}"
          fi
          case "$PACKAGE" in
            s3-upload-proxy|decap-cms-media-library-s3) ;;
            *) echo "Unknown package: $PACKAGE" >&2; exit 1 ;;
          esac
          echo "package=$PACKAGE" >> $GITHUB_OUTPUT
          echo "dir=packages/$PACKAGE" >> $GITHUB_OUTPUT

      - name: Build
        run: bun run --cwd packages/${{ steps.pkg.outputs.package }} build

      - name: Publish
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            npm pack --dry-run
          else
            npm publish --access public --provenance
          fi
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
